name: Test

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # firebase-admin@14 requires Node >= 22 (see PROGRESS.md deviations).
          node-version: 22
          cache: npm

      # firebase-tools@15 refuses to start the emulator on anything below JDK 21, and the
      # runner's default JDK is older. Needed by both emulator steps below.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Firestore rules tests
        run: npx firebase emulators:exec --only firestore --project demo-chipcheck "npm run test:rules"

      # The write path against real Firestore semantics: the dedupe race, lock
      # re-acquisition on undo, batch chunking, rate-limit windows, purge cutoffs.
      # Phase 2 added the Auth emulator: it implements createSessionCookie, so the owner
      # sign-in flow is exercised for real rather than mocked.
      - name: Integration tests (write path, shops, sessions)
        run: npx firebase emulators:exec --only firestore,auth --project demo-chipcheck "npm run test:integration"

      # The staff console in a real browser against a real listener: unlock, add, a second
      # tablet seeing the card, mark ready, recall, clear, clear all, the double-tap guard,
      # the undo and the shed nudge. Phase 3's Definition of Done asks for this against the
      # `dev` alias; until that exists it runs here against the emulator, which is the same
      # code path minus the network.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (staff console)
        run: npx firebase emulators:exec --only firestore,auth --project demo-chipcheck "npx playwright test"

      # The four widths §24 names, for the pixel comparison against v1 (Ian, by eye).
      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artefacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: No secrets in NEXT_PUBLIC_ variables
        run: |
          if grep -rInE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|PRIVATE|SERVICE_ACCOUNT|PASSWORD|PIN)[A-Z0-9_]*\s*=\s*\S' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude=.env.local.example .; then
            echo "::error::A NEXT_PUBLIC_ variable appears to hold a secret."
            exit 1
          fi
          echo "OK — no NEXT_PUBLIC_ variable holds a secret."
